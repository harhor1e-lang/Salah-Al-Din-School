name: Build iOS Package

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create Package & Config
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Salah Al-Din School" "com.salahaldin.app" --web-dir .
          npx cap add ios

      - name: Build Xcode App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Release-iphoneos/App.app Payload/ 2>/dev/null || cp -R ios/App/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Salah-Al-Din-School.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Package
          path: Salah-Al-Din-School.ipa
